name: Docker eetcafehaventje (develop)

on:
  push:
    branches: [ develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: smxsystems/eetcafehaventje
  DOCKERFILE: Dockerfile
  SERVICE: eetcafehaventje
  K8S_REPO: smxsystems/k8s-deployment

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Skip when commit is a production release
        id: release
        run: |
          if git tag -l 'v*' --points-at HEAD | grep -q .; then
            echo "skip_acceptance=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_acceptance=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute develop tag
        id: vars
        run: |
          short_sha="${GITHUB_SHA::8}"
          timestamp="$(date -u +'%Y%m%d-%H%M%S')"
          echo "develop_tag=develop-${timestamp}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.develop_tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger acceptance deployment
        if: steps.release.outputs.skip_acceptance != 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GHCR_TOKEN }}
          repository: ${{ env.K8S_REPO }}
          event-type: bump-acceptance
          client-payload: |
            {
              "service": "${{ env.SERVICE }}",
              "tag": "${{ steps.vars.outputs.develop_tag }}",
              "commit": "${{ github.sha }}",
              "actor": "${{ github.actor }}"
            }
